[package]
name = "authcore"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
bip39 = "2.2.2"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
percent-encoding = "2.3.2"
# Plain SQLite. The page-encryption layer of section 12.1 is NOT linked; see
# README.md, "Database encryption is not linked".
#
# SQLCipher was linked and working on the host, then removed: its vendored
# OpenSSL cannot cross-compile to Android from Windows. OpenSSL's Configure
# wants a `aarch64-linux-android-clang` that the Windows NDK does not provide
# under that name, and Android is the platform that ships. Section 12.1 allows
# any page-encrypting build and names SQLite3 Multiple Ciphers, which needs no
# OpenSSL and no Perl; that is the way back.
#
# `VaultKey::sqlcipher_key` and `Store::open`'s key parameter are kept, so
# relinking is a dependency change rather than a redesign.
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
subtle = "2.6.1"
uuid = { version = "1.24.1", features = ["v4"] }
zeroize = "1.9.0"
