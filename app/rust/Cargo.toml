[package]
name = "rust_lib_authenticator"
version = "0.1.0"
edition = "2021"

[features]
# Type-check the Android JNI module on a host that does not have an Android NDK.
# Production Android builds use the same JNI API.
jni-host-check = []

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"

# The core holds every security-critical decision. This crate is only the
# translation layer to Dart, so that one audit of `core` covers all platforms
# (PRD section 14.2).
#
# Stage S2 named a non-default `insecure-null-cipher` feature here, because
# there was no vault key yet and records were written unencrypted. Stage S3
# deleted that feature from the core, this line stopped resolving, and the
# crate had to be pointed at the real cipher. That breakage was the design.
authcore = { path = "../../core" }
anyhow = "1"

# The socket for the sync client. Deliberately here and not in `authcore`:
# rustls has to cross-compile to every target the app ships to, and keeping it
# out of the core means the crate holding the cryptography and the storage
# builds anywhere with no C toolchain. See src/http.rs.
#
# rustls rather than native-tls: no OpenSSL, which is what made SQLCipher
# impossible to cross-compile to Android from Windows earlier in this project.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking", "rustls-tls",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
x509-parser = "0.18"
sha2 = "0.10"
base64 = "0.22"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
jni = "0.21.1"
getrandom = "0.4"
zeroize = "1"

[build-dependencies]
base64 = "0.22"

[dev-dependencies]
rcgen = "0.14"

# The Android package contains one copy of this library for each processor
# architecture. Optimize the release library for size and link dependencies as
# one unit. Debug builds keep their normal fast compile settings.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Android owns the synchronization-session encryption key. Rust calls the
# small native token store directly, so access and refresh tokens never cross
# the Dart heap. The JNI module remains target-gated. The pure-Rust dependency
# is also available to the host-only type-check feature above.


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
