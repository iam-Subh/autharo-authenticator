[package]
name = "rust_lib_authenticator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"

# The core holds every security-critical decision. This crate is only the
# translation layer to Dart, so that one audit of `core` covers all platforms
# (PRD section 14.2).
#
# Stage S2 named a non-default `insecure-null-cipher` feature here, because
# there was no vault key yet and records were written unencrypted. Stage S3
# deleted that feature from the core, this line stopped resolving, and the
# crate had to be pointed at the real cipher. That breakage was the design.
authcore = { path = "../../core" }
anyhow = "1"
serde_json = "1.0.151"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
