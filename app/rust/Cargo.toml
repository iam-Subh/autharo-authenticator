[package]
name = "rust_lib_authenticator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"

# The core holds every security-critical decision. This crate is only the
# translation layer to Dart, so that one audit of `core` covers all platforms
# (PRD section 14.2).
#
# `insecure-null-cipher` is stage S2 scaffolding: there is no vault key yet, so
# records are written unencrypted. Stage S3 deletes that feature from the core,
# which breaks this line and forces it to be pointed at the real cipher.
authcore = { path = "../../core", features = ["insecure-null-cipher"] }
anyhow = "1"
serde_json = "1.0.151"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
